# hyprdeb managed: install.sh overwrites this file (~/.config/kitty/hyprdeb.conf).
# kitty.conf includes it at the top, so your own lines further down override anything here.

# Keep kitty on the font it always had (fontconfig's monospace used to be DejaVu Sans Mono): the monospace alias now starts with Noto Sans
# Mono for Latin so editors can render joined Persian, and kitty does no RTL shaping anyway.
font_family DejaVu Sans Mono

# Selecting text copies it to the clipboard (not only the primary selection).
copy_on_select clipboard

# Persian layout (ir, variant winkeys): kitty 0.41.1 matches shortcuts on the current-layout key, the shifted key
# and the native keysym, but not on the US-layout key it also knows (alternate_key). So with Persian active,
# ctrl+shift+c/v arrive as ctrl+shift+ز/ر and are sent to the program instead of copying/pasting.
# ز = Arabic_zain on the C key (AB03), ر = Arabic_ra on the V key (AB04), from /usr/share/X11/xkb/symbols/ir.
map ctrl+shift+ز copy_to_clipboard
map ctrl+shift+ر paste_from_clipboard
