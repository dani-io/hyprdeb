# hyprdeb managed: install.sh --greeter writes this file to /etc/sysctl.d/70-hyprdeb-console.conf (a differing existing file is backed up once).
# The login screen is on a text VT, and kernel messages of level ERR and below are printed on the console (the kernel's `quiet`
# only lowers it to level 4), so a harmless line like "usbhid ...: couldn't find an input interrupt endpoint" landed on top of the
# greeter. This shows only crit/alert/emerg on the console; everything still goes to the journal and dmesg.
# kernel.printk = console_loglevel default_message_loglevel minimum_console_loglevel default_console_loglevel
kernel.printk = 3 4 1 3
