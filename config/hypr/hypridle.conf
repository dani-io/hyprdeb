# hyprdeb managed: install.sh overwrites this file. Keep personal copies under another name.
# Idle policy: lock before suspend here; the idle timeouts come from settings.toml (see the end of this file).
# dpms syntax is the 0.55 Lua dispatcher (old "hyprctl dispatch dpms off" no longer works).

general {
    # loginctl lock-session (idle timeout, before_sleep_cmd) lands here. hyprdeb-lock checks the real lock
    # state, removes stray hyprlocks, switches to layout 0 (us) and starts hyprlock.
    lock_cmd = $HOME/.local/bin/hyprdeb-lock
    unlock_cmd = pkill -USR1 hyprlock              # "loginctl unlock-sessions" (plural, from a TTY) unlocks
    before_sleep_cmd = loginctl lock-session       # lock before suspend
    # 3 = hold the sleep inhibitor until Hyprland reports the lock frames drawn on all outputs (5 s fallback).
    # The default (2, "auto") only does that if lock_cmd contains the string "hyprlock"; with hyprdeb-lock it
    # fell back to 1, which releases the inhibitor right after starting before_sleep_cmd (hypridle 0.1.8 source).
    inhibit_sleep = 3
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# The listeners (lock after / screen off after) are generated by `hyprdeb apply` from ~/.config/hyprdeb/settings.toml
# (idle.lock_after, idle.screen_off_after; defaults 10 min / 15 min). If that file is missing, hypridle has no rules
# at all and nothing locks on idle: `hyprdeb apply` recreates it.
source = ~/.config/hypr/hyprdeb-idle.conf
