# hyprdeb managed: install.sh overwrites this file.
# The wallpaper block (path, fit_mode) is generated by `hyprdeb apply` from ~/.config/hyprdeb/settings.toml
# ([wallpaper] path, fit; default ~/.config/hypr/wallpaper.png, cover). install.sh only creates that default image
# when it is missing. See docs/gotchas.md (hyprpaper).

splash = false

source = ~/.config/hypr/hyprdeb-paper.conf
