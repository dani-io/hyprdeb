# hyprdeb managed: install.sh overwrites this file.
# Lock screen on every monitor (empty "monitor =" means all). Esc or Ctrl+U clears the input.
# The keyboard layout is shown because a password typed in the Persian layout fails. SUPER+L and hypridle
# switch to us before locking; Caps Lock (grp:caps_toggle) switches.

$font = JetBrains Mono

general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/.config/hypr/wallpaper.png
    blur_passes = 2
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    inner_color = rgba(16, 18, 24, 0.8)
    outer_color = rgba(120, 140, 180, 0.9)
    check_color = rgba(140, 200, 140, 0.9)
    fail_color = rgba(220, 100, 100, 0.9)
    font_color = rgb(220, 220, 220)
    font_family = $font
    fade_on_empty = false
    rounding = 8
    placeholder_text = password
    fail_text = $PAMFAIL
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = $font
    color = rgb(220, 220, 220)
    position = 0, 120
    halign = center
    valign = center
}

# $LAYOUT[a,b] maps layout index 0/1 to these short names.
label {
    monitor =
    text = keyboard: $LAYOUT[US,FA]
    font_size = 18
    font_family = $font
    color = rgb(170, 170, 170)
    position = 0, -100
    halign = center
    valign = center
}
