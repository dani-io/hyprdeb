# hyprdeb managed: generated by `hyprdeb apply` from ~/.config/hyprdeb/settings.toml. Do not edit; changes are overwritten.
# Sourced by hyprlock.conf. Empty monitor = every monitor; a block with a monitor is drawn over it (higher zindex).

background {
    monitor =
    path = ~/.config/hypr/wallpaper.png
    blur_passes = 2
}
