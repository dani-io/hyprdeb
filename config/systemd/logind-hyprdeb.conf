# hyprdeb managed: install.sh overwrites this file (/etc/systemd/logind.conf.d/hyprdeb.conf).
# hypridle (inhibit_sleep = 3) delays suspend until Hyprland reports the lock frames drawn on every output,
# or Hyprland's own 5 s fallback. logind's default limit for delay inhibitors is also 5 s; 10 s leaves room.
# Takes effect at the next boot. Do not restart systemd-logind for it (that can end the graphical session).
[Login]
InhibitDelayMaxSec=10
