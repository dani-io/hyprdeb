# hyprdeb managed: install.sh --virtualcam overwrites this file (/etc/modprobe.d/v4l2loopback.conf).
# One loopback device for OBS "Start Virtual Camera". video_nr=10 stays clear of real webcams (video0..3 on the
# author's PC: C922 + USB Camera). exclusive_caps=1 makes it look like a normal capture device to browsers
# (needed for Chrome/WebRTC to list it).
options v4l2loopback devices=1 video_nr=10 exclusive_caps=1 card_label="OBS Virtual Camera"
