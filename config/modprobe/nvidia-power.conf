# hyprdeb managed: install.sh --nvidia overwrites this file (/etc/modprobe.d/nvidia-power.conf).
# Save VRAM across suspend/hibernate (needed for a Wayland compositor to resume cleanly). The copy is written by
# nvidia-suspend/nvidia-hibernate.service to TemporaryFilePath; /tmp is tmpfs on Debian 13, /var/tmp is on disk.
# Takes effect after update-initramfs -u and a reboot; check /proc/driver/nvidia/params.
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp
